<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Simulador CDT</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f6fa;
         color: #1a1a2e; }
  h:form, form { max-width: 600px; margin: 2rem auto;
                 background: #fff; border: 1px solid #e8e8ed;
                 border-radius: 12px; padding: 2rem; }
  h2 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
  label { font-size: 13px; color: #555; display: block;
          margin-bottom: 4px; }
  input[type="text"], input[type="number"], select {
    width: 100%; padding: 8px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; margin-bottom: 1rem;
    outline: none; }
  input:focus, select:focus { border-color: #185fa5; }
  input[type="submit"], button {
    background: #185fa5; color: #fff; border: none;
    padding: 10px 24px; border-radius: 8px; font-size: 14px;
    cursor: pointer; margin-bottom: 1rem; }
  input[type="submit"]:hover, button:hover { background: #0c447c; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem;
          font-size: 13px; }
  th { background: #f5f6fa; padding: 8px 12px; text-align: left;
       font-weight: 500; border-bottom: 1px solid #e8e8ed; }
  td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
  footer { text-align: center; font-size: 12px; color: #aaa;
           margin-top: 2rem; padding-top: 1rem;
           border-top: 1px solid #e8e8ed; }
  a { color: #185fa5; }
</style>
</h:head>
<h:body>
	<h:form>
	<h2>Datos para el simulador</h2>
	<h:outputLabel for="inversion" value="Inversión:" />
         <h:inputText id="inversion" value="#{cdt.inversion}" required="true" >
            <f:convertNumber maxFractionDigits="2" />
    </h:inputText>
    <br/><br/>
     <h:outputLabel for="interes" value="Interés (% E.A.):" />
            <h:inputText id="interes" value="#{cdt.interes}" required="true" />
            <br/><br/>

            <h:outputLabel for="plazo" value="Plazo (días):" />
            <h:inputText id="plazo" value="#{cdt.plazo}" required="true" />
            <br/><br/>

            <h:commandButton value="Calcular Ganancia" action="#{cdt.calcular}"  >
                <f:ajax execute="@form" render="@form" />
            </h:commandButton>
            <br/><br/>

            <h:panelGroup rendered="#{cdt.ganancia > 0}">
                <h:outputText value="Valor Ganacia: "></h:outputText>

                <h:outputText value="#{cdt.ganancia}">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" groupingUsed="true" />
                </h:outputText>
                <br/>
                <h:outputText value="Valor final al vencimiento: "></h:outputText>
                <h:outputText value="#{cdt.valorFuturo - cdt.impuesto}">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" groupingUsed="true" />
                </h:outputText>
                <br/>
                <h:outputText value="Valor impuesto 4%: "></h:outputText>
                <h:outputText value="#{cdt.impuesto}">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" groupingUsed="true" />
                </h:outputText>
                   <br/>
                <h:outputText value="Ganancia despues de impuestos: "></h:outputText>
                <h:outputText value="#{cdt.ganancia - cdt.impuesto}">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" groupingUsed="true" />
                </h:outputText>

            </h:panelGroup>       
            
	</h:form>
	<footer>
		<a href="index.xhtml">Inicio</a>
		<br/><br/><br/><br/>
		<h4>Ing. Noé Arcos Muñoz  -  narcosm@udistrital.edu.co  -  2026  -  Programación</h4>
	</footer>
</h:body>
</html>
