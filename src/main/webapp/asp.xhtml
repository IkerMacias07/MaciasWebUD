<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Aspirante UD</title>
	<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f6fa;
         color: #1a1a2e; }
  h:form, form { max-width: 600px; margin: 2rem auto;
                 background: #fff; border: 1px solid #e8e8ed;
                 border-radius: 12px; padding: 2rem; }
  h2 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
  label { font-size: 13px; color: #555; display: block;
          margin-bottom: 4px; }
  input[type="text"], input[type="number"], select {
    width: 100%; padding: 8px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; margin-bottom: 1rem;
    outline: none; }
  input:focus, select:focus { border-color: #185fa5; }
  input[type="submit"], button {
    background: #185fa5; color: #fff; border: none;
    padding: 10px 24px; border-radius: 8px; font-size: 14px;
    cursor: pointer; margin-bottom: 1rem; }
  input[type="submit"]:hover, button:hover { background: #0c447c; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem;
          font-size: 13px; }
  th { background: #f5f6fa; padding: 8px 12px; text-align: left;
       font-weight: 500; border-bottom: 1px solid #e8e8ed; }
  td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
  footer { text-align: center; font-size: 12px; color: #aaa;
           margin-top: 2rem; padding-top: 1rem;
           border-top: 1px solid #e8e8ed; }
  a { color: #185fa5; }
</style>
</h:head>
<h:body>
	<h:form>
		<h2>Datos del Aspirante</h2>
		<h:outputLabel for="id_p" value="No. Identificación:" />
		<h:inputText id="id_p" value="#{asp.dto.id_p}" required="true" />

		<br />
		<br />
		<h:outputLabel for="nombres" value="Nombres:" />
		<h:inputText id="nombres" value="#{asp.dto.nombres}" required="true" />

		<br />
		<br />
		<h:outputLabel for="apellidos" value="Apellidos:" />
		<h:inputText id="apellidos" value="#{asp.dto.apellidos}"
			required="true" />
		<br />
		<br />
		<h:outputLabel for="telefono" value="Teléfono:" />
		<h:inputText id="telefono" value="#{asp.dto.telefono}" required="true" />
		<br />
		<br />
		<h:outputLabel for="correo" value="Correo:" />
		<h:inputText id="correo" value="#{asp.dto.correo}" required="true" />
		<br />
		<br />
		<h:outputLabel for="pro_aca" value="Programa Académico: " />
		<h:selectOneMenu id="pro_aca" value="#{asp.dto.pro_acad.cod}"
			required="true">
			<f:selectItem itemValue="-1" itemLabel="-- seleccione --"
				noSelectionOption="true" />
			<f:selectItems value="#{asp.listaPa}" var="p"
				itemValue="#{asp.listaPa.indexOf(p)}" itemLabel="#{p.nombre_prog}" />
		</h:selectOneMenu>
		<br />
		<br />

		<h:commandButton value="Registrar" action="#{asp.registrar}">
			<f:ajax execute="@form" render="@form" />
		</h:commandButton>
		<br />
		<br />

		<h:panelGroup rendered="#{!asp.listaAs.isEmpty()}">
			<h3>Aspirantes registrados</h3>

			<h:dataTable value="#{asp.listaAs}" var="aspirante" border="1"
				style="width:90%">

				<h:column>
					<f:facet name="header">N°.</f:facet>
					<h:outputText value="#{asp.listaAs.indexOf(aspirante) + 1}" />
				</h:column>
				<h:column>
					<f:facet name="header">Fecha Registro</f:facet>
					<h:outputText value="#{aspirante.fecha_reg}" />
				</h:column>
				<h:column>
					<f:facet name="header">Identificación</f:facet>
					<h:outputText value="#{aspirante.id_p}" />
				</h:column>
				<h:column>
					<f:facet name="header">Nombres</f:facet>
					<h:outputText value="#{aspirante.nombres}" />
				</h:column>
				<h:column>
					<f:facet name="header">Apellidos</f:facet>
					<h:outputText value="#{aspirante.apellidos}" />
				</h:column>
				<h:column>
					<f:facet name="header">Teléfono</f:facet>
					<h:outputText value="#{aspirante.telefono}" />
				</h:column>
				<h:column>
					<f:facet name="header">Correo</f:facet>
					<h:outputText value="#{aspirante.correo}" />
				</h:column>
				<h:column>
					<f:facet name="header">Programa Académico</f:facet>
					<h:outputText value="#{aspirante.pro_acad.nombre_prog}" />
				</h:column>

			</h:dataTable>

		</h:panelGroup>

	</h:form>
	<footer>
		<a href="index.xhtml">Inicio</a>
		<br/><br/><br/><br/>
		<h4>Ing. Noé Arcos Muñoz - narcosm@udistrital.edu.co - 2026 - Programación</h4>
	</footer>

</h:body>
</html>
