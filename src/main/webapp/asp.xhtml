<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Registro Aspirante UD</title>
	<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f6fa; color: #1a1a2e; }
  form { max-width: 650px; margin: 2rem auto; background: #fff;
         border: 1px solid #e8e8ed; border-radius: 12px; padding: 2rem;
         box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  h2 { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem;
       color: #185fa5; border-bottom: 2px solid #185fa5; padding-bottom: 8px; }
  h3 { font-size: 16px; color: #185fa5; margin-top: 1.5rem; margin-bottom: 1rem; }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; font-weight: 500; }
  input[type="text"], input[type="number"], select {
    width: 100%; padding: 8px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; margin-bottom: 4px; outline: none; }
  input:focus, select:focus { border-color: #185fa5; }
  input[type="submit"], button {
    background: #185fa5; color: #fff; border: none;
    padding: 10px 24px; border-radius: 8px; font-size: 14px;
    cursor: pointer; margin-top: 8px; margin-bottom: 1rem; width: 100%; }
  input[type="submit"]:hover, button:hover { background: #0c447c; }
  .error { color: #e53935; font-size: 12px; display: block; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 13px; }
  th { background: #185fa5; color: #fff; padding: 10px 12px; text-align: left;
       font-weight: 500; }
  td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
  tr:nth-child(even) { background: #f5f6fa; }
  tr:hover { background: #ddeeff; }
  footer { text-align: center; font-size: 12px; color: #aaa;
           margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e8e8ed; }
  a { color: #185fa5; }
</style>
</h:head>
<h:body>
	<h:form>
		<h2>Registro de Aspirante</h2>

		<h:outputLabel for="id_p" value="No. Identificación:" />
		<h:inputText id="id_p" value="#{asp.dto.id_p}" required="true"
			requiredMessage="⚠ Ingrese el número de identificación." />
		<h:message for="id_p" styleClass="error" />

		<h:outputLabel for="nombres" value="Nombres:" />
		<h:inputText id="nombres" value="#{asp.dto.nombres}" required="true"
			requiredMessage="⚠ Ingrese los nombres." />
		<h:message for="nombres" styleClass="error" />

		<h:outputLabel for="apellidos" value="Apellidos:" />
		<h:inputText id="apellidos" value="#{asp.dto.apellidos}" required="true"
			requiredMessage="⚠ Ingrese los apellidos." />
		<h:message for="apellidos" styleClass="error" />

		<h:outputLabel for="telefono" value="Teléfono:" />
		<h:inputText id="telefono" value="#{asp.dto.telefono}" required="true"
			requiredMessage="⚠ Ingrese el teléfono." />
		<h:message for="telefono" styleClass="error" />

		<h:outputLabel for="correo" value="Correo electrónico:" />
		<h:inputText id="correo" value="#{asp.dto.correo}" required="true"
			requiredMessage="⚠ Ingrese el correo electrónico." />
		<h:message for="correo" styleClass="error" />

		<h:outputLabel for="pro_aca" value="Programa Académico:" />
		<h:selectOneMenu id="pro_aca" value="#{asp.dto.pro_acad.cod}" required="true"
			requiredMessage="⚠ Seleccione un programa académico.">
			<f:selectItem itemValue="-1" itemLabel="-- seleccione --"
				noSelectionOption="true" />
			<f:selectItems value="#{asp.listaPa}" var="p"
				itemValue="#{asp.listaPa.indexOf(p)}" itemLabel="#{p.nombre_prog}" />
		</h:selectOneMenu>
		<h:message for="pro_aca" styleClass="error" />

		<h:commandButton value="Registrar Aspirante" action="#{asp.registrar}">
			<f:ajax execute="@form" render="@form" />
		</h:commandButton>

		<h:panelGroup rendered="#{!asp.listaAs.isEmpty()}">
			<h3>Aspirantes Registrados</h3>
			<h:dataTable value="#{asp.listaAs}" var="aspirante" styleClass="tabla">
				<h:column>
					<f:facet name="header">N°</f:facet>
					<h:outputText value="#{asp.listaAs.indexOf(aspirante) + 1}" />
				</h:column>
				<h:column>
					<f:facet name="header">Fecha Registro</f:facet>
					<h:outputText value="#{aspirante.fecha_reg}" />
				</h:column>
				<h:column>
					<f:facet name="header">Identificación</f:facet>
					<h:outputText value="#{aspirante.id_p}" />
				</h:column>
				<h:column>
					<f:facet name="header">Nombres</f:facet>
					<h:outputText value="#{aspirante.nombres}" />
				</h:column>
				<h:column>
					<f:facet name="header">Apellidos</f:facet>
					<h:outputText value="#{aspirante.apellidos}" />
				</h:column>
				<h:column>
					<f:facet name="header">Teléfono</f:facet>
					<h:outputText value="#{aspirante.telefono}" />
				</h:column>
				<h:column>
					<f:facet name="header">Correo</f:facet>
					<h:outputText value="#{aspirante.correo}" />
				</h:column>
				<h:column>
					<f:facet name="header">Programa Académico</f:facet>
					<h:outputText value="#{aspirante.pro_acad.nombre_prog}" />
				</h:column>
			</h:dataTable>
		</h:panelGroup>

	</h:form>
	<footer>
		<a href="index.xhtml">Inicio</a>
		<br/><br/>
		<h4>Iker Macias - ikerm@udistrital.edu.co - 2026 - Programación UD</h4>
	</footer>
</h:body>
</html>
